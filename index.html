<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择搜索引擎</title>
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background: #f0f0f0;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        form {
            display: inline-block;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        input[type="text"] {
            width: 300px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 10px;
            outline: none;
        }
        select {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 10px;
            outline: none;
            background: #fff;
            color: #333;
            transition: box-shadow 0.3s, transform 0.3s ease;
        }
        select:hover {
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transform: scale(1.05);
        }
        select:focus {
            box-shadow: 0 0 5px #007bff;
            transform: scale(1.1);
        }
        select option {
            padding: 10px;
            background: #ffffff;
            color: #333;
            transition: background 0.3s, color 0.3s;
        }
        select option:hover {
            background: #007bff;
            color: #ffffff;
        }
        /* 下拉菜单的移动效果 */
        select {
            position: relative;
            overflow: hidden;
        }
        select option {
            position: relative;
            animation: slide-in 0.3s ease-in-out;
        }
        @keyframes slide-in {
            from {
                transform: translateY(10px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        input[type="submit"] {
            padding: 10px 20px;
            font-size: 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        input[type="submit"]:hover {
            background: #0056b3;
        }
        footer {
            margin-top: 20px;
            font-size: 0.8em;
            color: #777;
        }
        iframe {
            width: 100%;
            height: 600px;
            border: none;
            border-radius: 10px;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        @media (max-width: 768px) {
            input[type="text"] {
                width: 80%;
            }
            iframe {
                height: 400px;
            }
        }
    </style>
</head>
<body>

    <h1>欢迎使用搜索引擎</h1>
    <form id="searchForm" onsubmit="return performSearch()">
        <input type="text" id="searchQuery" name="q" placeholder="请输入搜索内容" required>
        <br>
        <select id="searchEngine">
            <option value="360">360搜索</option>
            <option value="bing" selected>Bing</option>
            <option value="sougou">搜狗</option>
            <option value="souhu">搜狐</option>
        </select>
        <br>
        <input type="submit" value="搜索">
    </form>

    <iframe id="resultsFrame" src="" style="display:none;"></iframe>

    <footer>
        <p>&copy; 2024 搜索引擎，本站由baoshi666所拥有。</p>
    </footer>

    <script>
        function performSearch() {
            var query = document.getElementById('searchQuery').value;
            var engine = document.getElementById('searchEngine').value;
            var url;

            switch(engine) {
                case '360':
                    url = 'https://www.so.com/s?q=' + encodeURIComponent(query);
                    break;
                case 'bing':
                    url = 'https://www.bing.com/search?q=' + encodeURIComponent(query);
                    break;
                case 'sougou':
                    url = 'https://www.sogou.com/sie?hdq=AQ7CZ&query=' + encodeURIComponent(query);
                    break;
                case 'souhu':
                    url = 'https://search.sohu.com/?queryType=outside&keyword=' + encodeURIComponent(query);
                    break;
            }

            var resultsFrame = document.getElementById('resultsFrame');
            resultsFrame.src = url;
            resultsFrame.style.display = 'block';  // 显示 iframe
            return false;  // 不提交表单
        }
    </script>

</body>
</html>
