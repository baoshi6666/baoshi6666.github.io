<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麦克风声音发送器</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .container {
            text-align: center;
            border-radius: 10px;
            background-color: white;
            padding: 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        .button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            margin: 15px 0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        .button:hover {
            background-color: #45a049;
        }

        .status {
            margin-top: 10px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>麦克风声音发送器</h1>
        <button class="button" id="startButton">开始捕获麦克风声音</button>
        <button class="button" id="connectButton">连接蓝牙音响</button>
        <div class="status" id="status">状态：未连接</div>
    </div>

    <script>
        let audioContext, microphoneStream, audioSourceNode, bluetoothDevice, audioOutput;

        // 开始捕获麦克风音频
        document.getElementById('startButton').addEventListener('click', function() {
            startMicrophoneCapture();
        });

        // 蓝牙连接按钮事件
        document.getElementById('connectButton').addEventListener('click', function() {
            connectBluetooth();
        });

        // 捕获麦克风音频
        async function startMicrophoneCapture() {
            try {
                // 获取麦克风音频流
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                microphoneStream = stream;

                // 创建音频上下文
                audioContext = new (window.AudioContext || window.webkitAudioContext)();

                // 创建音频源节点
                audioSourceNode = audioContext.createMediaStreamSource(microphoneStream);

                // 如果连接了蓝牙设备，则输出到蓝牙设备
                if (bluetoothDevice) {
                    const bluetoothAudioOutput = await getBluetoothAudioOutput();
                    audioSourceNode.connect(bluetoothAudioOutput); // 输出到蓝牙音响
                    document.getElementById('status').innerText = `状态：音频已输出到蓝牙音响 ${bluetoothDevice.name}`;
                } else {
                    // 默认输出到浏览器的音频设备（扬声器或耳机）
                    audioSourceNode.connect(audioContext.destination); // 输出到默认扬声器
                    document.getElementById('status').innerText = "状态：正在捕获麦克风声音";
                }
            } catch (error) {
                document.getElementById('status').innerText = `状态：获取麦克风失败 - ${error}`;
            }
        }

        // 获取蓝牙设备的音频输出
        async function getBluetoothAudioOutput() {
            try {
                if (!bluetoothDevice) {
                    throw new Error('蓝牙设备未连接');
                }
                // 示例代码：假设设备支持音频输出
                const audioService = await bluetoothDevice.gatt.connect();
                const audioOutput = audioService.getPrimaryService('audio');
                return audioOutput;
            } catch (error) {
                console.error('获取蓝牙音频输出失败：', error);
                return null;
            }
        }

        // 蓝牙连接逻辑
        async function connectBluetooth() {
            if (!navigator.bluetooth) {
                alert("您的浏览器不支持Web Bluetooth API");
                return;
            }

            try {
                // 请求连接蓝牙设备
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: ['audio'] }],
                    optionalServices: ['battery_service']
                });
                bluetoothDevice = device;
                document.getElementById('status').innerText = `状态：已连接到 ${device.name}`;
                
                // 这里仅是连接蓝牙设备，音频流的传输将依赖于浏览器和设备支持的协议
            } catch (error) {
                document.getElementById('status').innerText = `状态：连接失败 - ${error}`;
            }
        }
    </script>
</body>
</html>
